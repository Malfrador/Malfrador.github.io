<!DOCTYPE html>
<html lang="de">
<head>

    <style>
        body { background-color: #F5EBE9; }
        .text-brand-purple { color: #6B5B7A; }
        #header-placeholder, #footer-placeholder { opacity: 0; transition: opacity 0.2s; }
        #header-placeholder.loaded, #footer-placeholder.loaded { opacity: 1; }
        
        /* Hide horizontal scrollbar but keep functionality */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sparkle animation for heart button */
        @keyframes sparkle-burst-heart {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .sparkle-container-heart {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .sparkle-heart {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #FFD700;
            border-radius: 50%;

                        <button id="edit-profile-btn" class="bg-white/90 backdrop-blur-sm px-4 py-2 rounded-lg font-semibold text-sm shadow hover:bg-white transition flex items-center gap-2">

    <div id="footer-placeholder" class="mt-16"></div>

    <script>
        // Load header and footer components
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    const element = document.getElementById(id);
                    element.innerHTML = data;
                    element.classList.add('loaded');
                    
                    element.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                });
        }

        // Create profile event card 
        function createProfileEventCard(event, index, section = 'meine') {
            const displayLocation = event.location || event.organiser || '';
            const hasLocation = event.location;
            
            return `
                <a href="event.html?id=carousel-${index}" class="flex-shrink-0 w-64 bg-white rounded-2xl shadow-sm overflow-hidden hover:shadow-lg transition-shadow duration-300 block relative">
                    <button onclick="event.stopPropagation()" class="absolute top-2 right-2 z-10 bg-white/90 backdrop-blur-sm p-2 rounded-lg hover:bg-white transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                        </svg>
                    </button>
                    <div class="h-32 bg-gray-200 overflow-hidden">
                        <img src="${event.image}" alt="" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 space-y-2">
                        <span class="btn-tag">${event.category}</span>
                        <h3 class="font-bold text-sm">${event.title}</h3>
                        ${displayLocation ? `<p class="text-xs text-gray-500 ${hasLocation ? 'underline' : ''}">${displayLocation}</p>` : ''}
                        <p class="text-xs text-gray-400">${event.date} · ${event.time}</p>
                    </div>
                </div>
            `;
        }

        // Create past event card with participant avatars
        function createPastEventCard(event, index) {
            return `
                <a href="event.html?id=carousel-${index}" class="flex-shrink-0 w-64 bg-white/70 backdrop-blur-sm rounded-2xl shadow-sm overflow-hidden hover:shadow-lg transition-all duration-300 block relative">
                    <div class="h-48 bg-gray-300 overflow-hidden relative">
                        <img src="${event.image}" alt="" class="w-full h-full object-cover opacity-60">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                        <div class="absolute bottom-0 left-0 right-0 p-4">
                            <h3 class="font-bold text-white text-lg mb-1">${event.title}</h3>
                            <p class="text-white/90 text-xs">${event.date}</p>
                        </div>
                    </div>
                    <div class="p-3">
                        <div class="flex items-center gap-2">
                            <div class="flex -space-x-2">
                                <div class="w-7 h-7 rounded-full bg-purple-400 border-2 border-white flex items-center justify-center">
                                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                    </svg>
                                </div>
                                <div class="w-7 h-7 rounded-full bg-pink-400 border-2 border-white flex items-center justify-center">
                                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                    </svg>
                                </div>
                                <div class="w-7 h-7 rounded-full bg-blue-400 border-2 border-white flex items-center justify-center">
                                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render profile events
        function renderMyEvents() {
            const carousel = document.getElementById('meine-events-carousel');
            
            // Get bookmarked events from cookie
            const bookmarkedIds = getBookmarkedEvents();
            
            if (bookmarkedIds.length === 0) {
                // Show placeholder if no bookmarks
                carousel.innerHTML = `
                    <div class="w-full text-center py-12">
                        <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                        <p class="text-gray-500">Noch keine Events gemerkt</p>
                        <p class="text-gray-400 text-sm mt-2">Klicke auf das Lesezeichen-Icon bei einem Event, um es hier zu speichern</p>
                    </div>
                `;
                return;
            }
            
            // Get bookmarked events data
            const myEvents = [];
            bookmarkedIds.forEach(eventId => {
                const { section, index } = parseEventId(eventId);
                const event = eventsData[section]?.[index];
                if (event) {
                    myEvents.push({ ...event, id: eventId, originalIndex: index });
                }
            });
            
            carousel.innerHTML = myEvents.map(event => createProfileEventCard(event, event.originalIndex, 'meine')).join('');
        }
        
        // Helper to parse event ID
        function parseEventId(eventId) {
            const [section, index] = eventId.split('-');
            return { section, index: parseInt(index) };
        }
        
        // Get bookmarked events from cookie
        function getBookmarkedEvents() {
            const bookmarks = getCookie('bookmarked_events');
            return bookmarks ? JSON.parse(bookmarks) : [];
        }

        // Render past events
        function renderPastEvents() {
            const carousel = document.getElementById('vergangene-events-carousel');
            // Using some events as past events
            const pastEvents = [
                { ...eventsData.carousel[0], date: '03.12.2025', title: 'FLINTA* Filmabend' },
                { ...eventsData.carousel[1], date: '26.11.2025', title: 'Pudding essen mit ...' },
                { ...eventsData.carousel[2], date: '02.10.2025', title: 'FLINTA* Game Night' }
            ];
            carousel.innerHTML = pastEvents.map((event, index) => createPastEventCard(event, index)).join('');
        }

        // Initialize scroll buttons
        function initializeScrollButtons(carouselId, leftBtnClass, rightBtnClass) {
            const carousel = document.getElementById(carouselId);
            const scrollLeftBtn = document.querySelector(`.${leftBtnClass}`);
            const scrollRightBtn = document.querySelector(`.${rightBtnClass}`);

            scrollLeftBtn.addEventListener('click', () => {
                carousel.scrollBy({ left: -300, behavior: 'smooth' });
            });

            scrollRightBtn.addEventListener('click', () => {
                carousel.scrollBy({ left: 300, behavior: 'smooth' });
            });
        }

        // Initialize filter tags with actual filtering
        function initializeFilterTags() {
            const filterTags = document.querySelectorAll('.filter-tag');
            const carousel = document.getElementById('meine-events-carousel');
            
            filterTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const category = tag.getAttribute('data-category');
                    const isActive = tag.classList.contains('bg-pink-400') || tag.classList.contains('bg-orange-400') || tag.classList.contains('bg-yellow-400');
                    
                    if (isActive) {
                        // Clicking active button - deactivate and show all
                        deactivateTag(tag);
                        showAllEvents();
                    } else {
                        // Clicking inactive button - activate and filter
                        resetFilterTags();
                        activateTag(tag);
                        filterEventsByCategory(category);
                    }
                });
            });
            
            function activateTag(tag) {
                if (tag.classList.contains('bg-pink-200') || tag.classList.contains('bg-pink-300')) {
                    tag.classList.remove('bg-pink-200', 'bg-pink-300');
                    tag.classList.add('bg-pink-400');
                } else if (tag.classList.contains('bg-orange-200') || tag.classList.contains('bg-orange-300')) {
                    tag.classList.remove('bg-orange-200', 'bg-orange-300');
                    tag.classList.add('bg-orange-400');
                } else if (tag.classList.contains('bg-yellow-200') || tag.classList.contains('bg-yellow-300')) {
                    tag.classList.remove('bg-yellow-200', 'bg-yellow-300');
                    tag.classList.add('bg-yellow-400');
                }
            }
            
            function deactivateTag(tag) {
                if (tag.classList.contains('bg-pink-400')) {
                    tag.classList.remove('bg-pink-400');
                    tag.classList.add('bg-pink-300');
                } else if (tag.classList.contains('bg-orange-400')) {
                    tag.classList.remove('bg-orange-400');
                    tag.classList.add('bg-orange-200');
                } else if (tag.classList.contains('bg-yellow-400')) {
                    tag.classList.remove('bg-yellow-400');
                    tag.classList.add('bg-yellow-200');
                }
            }
            
            function resetFilterTags() {
                filterTags.forEach(t => {
                    if (t.classList.contains('bg-pink-400')) {
                        t.classList.remove('bg-pink-400');
                        t.classList.add('bg-pink-300');
                    } else if (t.classList.contains('bg-orange-400')) {
                        t.classList.remove('bg-orange-400');
                        t.classList.add('bg-orange-200');
                    } else if (t.classList.contains('bg-yellow-400')) {
                        t.classList.remove('bg-yellow-400');
                        t.classList.add('bg-yellow-200');
                    }
                });
            }
            
            function showAllEvents() {
                const cards = carousel.querySelectorAll('.flex-shrink-0');
                cards.forEach(card => card.style.display = 'block');
                carousel.scrollLeft = 0;
            }
            
            function filterEventsByCategory(category) {
                const cards = carousel.querySelectorAll('.flex-shrink-0');
                let hasVisibleCards = false;
                
                cards.forEach(card => {
                    const cardCategory = card.querySelector('.btn-tag')?.textContent.trim();
                    if (cardCategory === category) {
                        card.style.display = 'block';
                        hasVisibleCards = true;
                    } else {
                        card.style.display = 'none';
                    }
                });
                
                carousel.scrollLeft = 0;
            }
        }

        // Cookie utilities
        function setCookie(name, value, days = 365) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/`;
        }
        
        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(cookie.substring(nameEQ.length));
                }
            }
            return null;
        }
        
        // Save profile data to cookies
        function saveProfileData(pronouns, age, location, bio) {
            setCookie('profile_pronouns', pronouns);
            setCookie('profile_age', age);
            setCookie('profile_location', location);
            setCookie('profile_bio', bio);
        }
        
        // Load profile data from cookies
        function loadProfileData() {
            const pronouns = getCookie('profile_pronouns');
            const age = getCookie('profile_age');
            const location = getCookie('profile_location');
            const bio = getCookie('profile_bio');
            
            return {
                pronouns: pronouns || 'she/her/they',
                age: age || '22',
                location: location || 'Oststadt, Ulm',
                bio: bio || 'Hallo, das ist meine Bio :)'
            };
        }

        // Initialize profile editing
        function initializeProfileEdit() {
            const editBtn = document.getElementById('edit-profile-btn');
            const saveBtn = document.getElementById('save-profile-btn');
            const cancelBtn = document.getElementById('cancel-edit-btn');
            
            const pronounsDisplay = document.getElementById('pronouns-display');
            const pronounsEdit = document.getElementById('pronouns-edit');
            
            const ageLocationDisplay = document.getElementById('age-location-display');
            const ageLocationEdit = document.getElementById('age-location-edit');
            const ageEdit = document.getElementById('age-edit');
            const locationEdit = document.getElementById('location-edit');
            
            const bioDisplay = document.getElementById('bio-display');
            const bioEdit = document.getElementById('bio-edit');
            
            const editActions = document.getElementById('edit-actions');
            
            let isEditing = false;
            
            // Load saved profile data on initialization
            const savedData = loadProfileData();
            pronounsDisplay.textContent = savedData.pronouns;
            pronounsEdit.value = savedData.pronouns;
            ageLocationDisplay.textContent = `${savedData.age} | ${savedData.location}`;
            ageEdit.value = savedData.age;
            locationEdit.value = savedData.location;
            bioDisplay.textContent = savedData.bio;
            bioEdit.value = savedData.bio;
            
            editBtn.addEventListener('click', () => {
                isEditing = true;
                
                // Hide displays, show edits
                pronounsDisplay.classList.add('hidden');
                pronounsEdit.classList.remove('hidden');
                
                ageLocationDisplay.classList.add('hidden');
                ageLocationEdit.classList.remove('hidden');
                
                bioDisplay.classList.add('hidden');
                bioEdit.classList.remove('hidden');
                
                editActions.classList.remove('hidden');
                editBtn.classList.add('hidden');
            });
            
            saveBtn.addEventListener('click', () => {
                // Save values to display
                pronounsDisplay.textContent = pronounsEdit.value;
                ageLocationDisplay.textContent = `${ageEdit.value} | ${locationEdit.value}`;
                bioDisplay.textContent = bioEdit.value;
                
                // Save to cookies
                saveProfileData(pronounsEdit.value, ageEdit.value, locationEdit.value, bioEdit.value);
                
                // Exit edit mode
                exitEditMode();
            });
            
            cancelBtn.addEventListener('click', () => {
                // Reset values to original
                pronounsEdit.value = pronounsDisplay.textContent;
                ageEdit.value = ageLocationDisplay.textContent.split(' | ')[0];
                locationEdit.value = ageLocationDisplay.textContent.split(' | ')[1];
                bioEdit.value = bioDisplay.textContent;
                
                // Exit edit mode
                exitEditMode();
            });
            
            function exitEditMode() {
                isEditing = false;
                
                // Show displays, hide edits
                pronounsDisplay.classList.remove('hidden');
                pronounsEdit.classList.add('hidden');
                
                ageLocationDisplay.classList.remove('hidden');
                ageLocationEdit.classList.add('hidden');
                
                bioDisplay.classList.remove('hidden');
                bioEdit.classList.add('hidden');
                
                editActions.classList.add('hidden');
                editBtn.classList.remove('hidden');
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
            
            renderMyEvents();
            renderPastEvents();
            
            initializeScrollButtons('meine-events-carousel', 'scroll-btn-left', 'scroll-btn-right');
            initializeScrollButtons('vergangene-events-carousel', 'scroll-btn-left-past', 'scroll-btn-right-past');
            initializeFilterTags();
            initializeProfileEdit();
            initializeHeartButton();
        });

        // Initialize heart button with sparkle and color toggle
        function initializeHeartButton() {
            const heartBtn = document.getElementById('heart-btn');
            const heartIcon = document.getElementById('heart-icon');
            let isLiked = false;

            heartBtn.addEventListener('click', (e) => {
                // Toggle color
                isLiked = !isLiked;
                if (isLiked) {
                    heartIcon.style.color = '#6750A4';
                } else {
                    heartIcon.style.color = '#FCFAF9';
                }

                // Create sparkles
                const container = heartBtn.querySelector('.sparkle-container-heart');
                container.innerHTML = '';

                for (let i = 0; i < 8; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle-heart';
                    
                    const angle = (i / 8) * Math.PI * 2;
                    const distance = 50;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    sparkle.style.setProperty('--tx', `${tx}px`);
                    sparkle.style.setProperty('--ty', `${ty}px`);
                    sparkle.style.left = '50%';
                    sparkle.style.top = '50%';
                    sparkle.style.transform = 'translate(-50%, -50%)';
                    
                    container.appendChild(sparkle);
                }
            });
        }
    </script>

</body>
</html>
