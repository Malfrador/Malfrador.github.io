<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - FLINTA* Circle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F5EBE9; }
        .text-brand-purple { color: #6B5B7A; }
        #header-placeholder, #footer-placeholder { opacity: 0; transition: opacity 0.2s; }
        #header-placeholder.loaded, #footer-placeholder.loaded { opacity: 1; }
    </style>
    <script src="js/events-data.js"></script>
</head>
<body class="font-sans text-gray-800">

    <div id="header-placeholder" class="sticky top-0 z-50"></div>

    <main class="max-w-4xl mx-auto px-6 py-8 mt-28">
        
        <!-- Back Button -->
        <button onclick="window.history.back()" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-6 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span class="font-semibold">Zurück</span>
        </button>

        <!-- Event Detail Card -->
        <div id="event-detail" class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="flex flex-col md:flex-row">
                <!-- Left Column - Image and Title -->
                <div class="md:w-5/12 p-8 md:p-10">
                    <!-- Event Image -->
                    <div class="bg-gray-200 h-64 md:h-80 overflow-hidden rounded-2xl mb-6">
                        <img id="event-image" src="" alt="" class="w-full h-full object-cover">
                    </div>

                    <!-- Title -->
                    <h1 id="event-title" class="text-3xl md:text-4xl font-bold text-gray-900 mb-4"></h1>

                    <!-- Date and Time -->
                    <div class="mb-4">
                        <div id="event-date" class="text-lg font-bold text-gray-900"></div>
                        <div id="event-time" class="text-md text-gray-600"></div>
                    </div>

                    <!-- Category Tags -->
                    <div class="flex flex-wrap gap-2">
                        <span id="event-category" class="btn-tag"></span>
                        <span class="btn-tag">
                            FLINTA* ONLY
                        </span>
                    </div>
                </div>

                <!-- Right Column - Details and Actions -->
                <div class="flex-1 p-8 md:p-10 relative flex flex-col">
                    <!-- Bookmark Icon -->
                    <div class="absolute top-4 right-4">
                        <button id="bookmark-btn" class="bg-white/90 backdrop-blur-sm p-2 rounded-lg shadow hover:bg-white transition">
                            <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Event Organizer Info -->
                    <div id="event-organiser-section" class="mb-6" style="display: none;">
                        <div class="text-sm text-gray-600 mb-1">Event von</div>
                        <div id="event-organiser" class="font-bold text-gray-900 mb-2"></div>
                        <a href="#" id="event-organiser-link" class="text-sm text-gray-600 underline hover:text-gray-900 transition">
                            Mehr von <span id="event-organiser-name"></span>
                        </a>
                    </div>

                    <!-- Location (if any) -->
                    <div id="event-location-section" class="mb-4" style="display: none;">
                        <div class="text-sm text-gray-600 mb-1">Diese Veranstaltung ist kostenpflichtig</div>
                        <div id="event-location-text" class="text-md text-gray-700">📍 <span id="event-location"></span></div>
                    </div>

                    <!-- Description -->
                    <div id="event-description" class="mb-6 space-y-3 text-gray-700 leading-relaxed"></div>

                    <!-- Reviews Link -->
                    <a href="#" class="inline-block text-gray-600 underline text-sm hover:text-gray-900 transition mb-6">
                        Bewertungen (23)
                    </a>

                    <!-- Action Buttons -->
                    <div class="flex flex-col gap-3 mt-auto">
                        <button class="btn-auth">
                            Jetzt anmelden
                        </button>
                        <button class="btn-auth">
                            Mehr erfahren
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Similar Events Section -->
        <section class="mt-12">
            <h2 class="text-xl font-bold text-brand-purple mb-6">Ähnliche Events</h2>
            <div id="similar-events" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Similar event cards will be generated here -->
            </div>
        </section>

    </main>

    <div id="footer-placeholder" class="mt-16"></div>

    <script>
        // Load header and footer components
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    const element = document.getElementById(id);
                    element.innerHTML = data;
                    element.classList.add('loaded');
                    
                    element.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                });
        }

        // Get event ID from URL parameters
        function getEventId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || 'carousel-0'; // Default to first carousel event
        }

        // Parse event ID to get the section and index
        function parseEventId(eventId) {
            const [section, index] = eventId.split('-');
            return { section, index: parseInt(index) };
        }

        // Load and display event details
        function loadEventDetails() {
            const eventId = getEventId();
            const { section, index } = parseEventId(eventId);
            
            const event = eventsData[section]?.[index];
            
            if (!event) {
                document.getElementById('event-detail').innerHTML = `
                    <div class="p-8 text-center">
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Event nicht gefunden</h2>
                        <p class="text-gray-600 mb-6">Das gesuchte Event konnte nicht gefunden werden.</p>
                        <button onclick="window.history.back()" class="inline-block bg-brand-purple text-white px-6 py-3 rounded-lg font-semibold hover:bg-opacity-90 transition">
                            Zurück zu Events
                        </button>
                    </div>
                `;
                return;
            }

            // Populate event details
            document.getElementById('event-image').src = event.image;
            document.getElementById('event-image').alt = event.title;
            
            const categoryTag = document.getElementById('event-category');
            categoryTag.textContent = event.category;
            categoryTag.className = 'btn-tag';
            
            document.getElementById('event-title').textContent = event.title;
            document.getElementById('event-date').textContent = event.date;
            document.getElementById('event-time').textContent = event.time;
            
            // Handle location
            const locationSection = document.getElementById('event-location-section');
            const locationElement = document.getElementById('event-location');
            if (event.location) {
                locationElement.textContent = event.location;
                locationSection.style.display = 'block';
            } else {
                locationSection.style.display = 'none';
            }
            
            // Handle description
            const descriptionElement = document.getElementById('event-description');
            
            if (event.description) {
                // Split description into paragraphs if it contains line breaks
                const paragraphs = event.description.split('\n\n');
                descriptionElement.innerHTML = paragraphs
                    .map(p => `<p class="text-gray-700 leading-relaxed">${p}</p>`)
                    .join('');
            } else {
                descriptionElement.style.display = 'none';
            }
            
            // Handle organiser
            const organiserSection = document.getElementById('event-organiser-section');
            if (event.organiser) {
                document.getElementById('event-organiser').textContent = event.organiser;
                document.getElementById('event-organiser-name').textContent = event.organiser;
                organiserSection.style.display = 'block';
            } else {
                organiserSection.style.display = 'none';
            }
            
            // Bookmark functionality
            const bookmarkBtn = document.getElementById('bookmark-btn');
            bookmarkBtn.onclick = function() {
                toggleBookmark(eventId);
            };
            updateBookmarkButton(eventId);

            // Update page title
            document.title = `${event.title} - FLINTA* Circle`;
            
            // Load similar events
            loadSimilarEvents(event, section, index);
        }

        // Load similar events (same category or random)
        function loadSimilarEvents(currentEvent, currentSection, currentIndex) {
            const similarEventsContainer = document.getElementById('similar-events');
            
            // Collect all events except the current one
            let allEvents = [];
            ['carousel', 'grid'].forEach(section => {
                eventsData[section]?.forEach((event, index) => {
                    const eventId = `${section}-${index}`;
                    const currentId = `${currentSection}-${currentIndex}`;
                    if (eventId !== currentId) {
                        allEvents.push({ ...event, id: eventId, section });
                    }
                });
            });

            // Try to find events with same category first
            let similar = allEvents.filter(e => e.category === currentEvent.category);
            
            // If not enough, add random events
            if (similar.length < 3) {
                const others = allEvents.filter(e => e.category !== currentEvent.category);
                similar = [...similar, ...others];
            }

            // Take first 3
            similar = similar.slice(0, 3);

            // Render similar events
            similarEventsContainer.innerHTML = similar.map(event => `
                <a href="event.html?id=${event.id}" class="block bg-white rounded-xl overflow-hidden shadow hover:shadow-lg transition group">
                    <div class="h-40 bg-gray-200 overflow-hidden">
                        <img src="${event.image}" alt="${event.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-4">
                        <span class="btn-tag">
                            ${event.category}
                        </span>
                        <h3 class="font-bold text-gray-900 mb-2 line-clamp-2">${event.title}</h3>
                        <div class="flex items-center gap-2 text-sm text-gray-600 mb-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            <span>${event.location}</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-gray-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span>${event.date}</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // Bookmark cookie utilities
        function getBookmarkedEvents() {
            const bookmarks = getCookie('bookmarked_events');
            return bookmarks ? JSON.parse(bookmarks) : [];
        }

        function saveBookmarkedEvents(bookmarks) {
            setCookie('bookmarked_events', JSON.stringify(bookmarks), 365);
        }

        function toggleBookmark(eventId) {
            let bookmarks = getBookmarkedEvents();
            const index = bookmarks.indexOf(eventId);
            
            if (index > -1) {
                bookmarks.splice(index, 1);
            } else {
                bookmarks.push(eventId);
            }
            
            saveBookmarkedEvents(bookmarks);
            updateBookmarkButton(eventId);
        }

        function updateBookmarkButton(eventId) {
            const bookmarks = getBookmarkedEvents();
            const isBookmarked = bookmarks.includes(eventId);
            const button = document.getElementById('bookmark-btn');
            const svg = button?.querySelector('svg');
            
            if (svg) {
                if (isBookmarked) {
                    svg.setAttribute('fill', 'currentColor');
                    svg.classList.add('text-black-500');
                } else {
                    svg.setAttribute('fill', 'none');
                    svg.classList.remove('text-black-500');
                    svg.classList.add('text-gray-700');
                }
            }
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(cookie.substring(nameEQ.length));
                }
            }
            return null;
        }

        function setCookie(name, value, days = 365) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/`;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
            loadEventDetails();
        });
    </script>

</body>
</html>
