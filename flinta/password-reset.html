<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen - FLINTA* Circle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(to bottom, #F9E9E1 0%, #E2D8E0 100%); }
        .bg-brand-purple { background-color: #AC94B8; }
        .bg-brand-peach { background-color: #fff1e6; }
        .bg-brand-mission { background-color: #e2d1db; }
        #header-placeholder, #footer-placeholder { opacity: 0; transition: opacity 0.2s; }
        #header-placeholder.loaded, #footer-placeholder.loaded { opacity: 1; }
    </style>
</head>
<body class="font-sans text-gray-800">

    <div id="header-placeholder" class="sticky top-0 z-50"></div>

    <main class="max-w-5xl mx-auto px-6 py-12 mt-28">
        <div class="max-w-md mx-auto">
            
            <!-- Error Message -->
            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-6 py-4 rounded-2xl mb-6">
                <p class="text-sm font-semibold"></p>
            </div>

            <!-- Success Message -->
            <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-6 py-4 rounded-2xl mb-6">
                <p class="text-sm font-semibold"></p>
            </div>

            <!-- Password Reset Card -->
            <div class="bg-white rounded-3xl shadow-lg p-8 md:p-12">
                <div class="text-center mb-8">
                    <span class="text-xs uppercase tracking-widest px-4 py-2 rounded-[20px]" style="background-color: #C0B6D7; color: #FCFAF9;">FLINTA* Community</span>
                    <h1 class="text-3xl font-bold mt-6 mb-2" style="color: #3A2B2E;">Passwort zurücksetzen</h1>
                    <p class="text-sm text-gray-600">Gib deine E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen</p>
                </div>

                <form id="reset-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">E-Mail</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="deine@email.de"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-400 transition"
                        >
                    </div>

                    <button 
                        type="submit" 
                        class="w-full text-white font-bold py-3 rounded-xl transition"
                        style="background-color: #C0B6D7;"
                        onmouseover="this.style.backgroundColor='#6750A4'"
                        onmouseout="this.style.backgroundColor='#C0B6D7'"
                    >
                        Link senden
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-sm text-gray-600">
                        <a href="login.html" class="text-purple-700 hover:text-purple-900 font-bold">← Zurück zum Login</a>
                    </p>
                </div>
            </div>

            <!-- Info Section -->
            <div class="mt-8 bg-brand-peach rounded-2xl p-6 text-center">
                <p class="text-sm text-gray-700">
                    <span class="font-bold">Info:</span> Du erhältst eine E-Mail mit einem Link, um dein Passwort zurückzusetzen. Der Link ist 24 Stunden gültig.
                </p>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // Poor people web framework to load header and footer
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    const element = document.getElementById(id);
                    element.innerHTML = data;
                    element.classList.add('loaded');
                    
                    // Execute any scripts in the loaded content
                    element.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                });
        }

        loadComponent('header-placeholder', 'header.html');
        loadComponent('footer-placeholder', 'footer.html');

        // Form validation and submission
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const errorBox = document.getElementById('error-message');
            const successBox = document.getElementById('success-message');
            const errorText = errorBox.querySelector('p');
            const successText = successBox.querySelector('p');
            
            // Hide all messages
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');
            
            // Validate email
            if (!email) {
                errorText.textContent = 'Bitte gib deine E-Mail-Adresse ein.';
                errorBox.classList.remove('hidden');
                errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            
            if (!email.includes('@')) {
                errorText.textContent = 'Bitte gib eine gültige E-Mail-Adresse ein.';
                errorBox.classList.remove('hidden');
                errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            
            // Simulate successful password reset request
            successText.textContent = 'E-Mail gesendet! Bitte überprüfe dein Postfach.';
            successBox.classList.remove('hidden');
            successBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Clear form
            document.getElementById('email').value = '';
            
            // Optionally redirect to login after a delay
            setTimeout(() => {
                // window.location.href = 'login.html';
            }, 3000);
        });
    </script>

</body>
</html>
