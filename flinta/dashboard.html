<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FLINTA* Circle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(to bottom, #F9E9E1 0%, #E2D8E0 100%); }
        .text-brand-purple { color: #6B5B7A; }
        #header-placeholder, #footer-placeholder { opacity: 0; transition: opacity 0.2s; }
        #header-placeholder.loaded, #footer-placeholder.loaded { opacity: 1; }
        
        /* Hide horizontal scrollbar but keep functionality */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <link rel="stylesheet" href="css/bookmark-modal.css">
    <script src="js/events-data.js"></script>
    <script src="js/events-utils.js"></script>
    <script src="js/bookmark-modal.js"></script>
</head>
<body class="font-sans text-gray-800">

    <div id="header-placeholder" class="sticky top-0 z-50"></div>

    <main class="max-w-6xl mx-auto px-6 py-8 mt-28">
        
        <!-- Welcome Header -->
        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Hallo, <span id="username">SaturoGojo67</span>✨</h1>
            <p class="text-gray-600">Willkommen zurück im FLINTA*Circle Ulm.</p>
        </section>

        <!-- Entdecke Section -->
        <section class="mb-12">
            <h2 class="text-xl font-bold text-brand-purple mb-6">Entdecke</h2>
            
            <!-- Horizontal Scrollable Cards -->
            <div class="relative">
                <button id="scroll-left-entdecke" class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 backdrop-blur-sm p-2 rounded-full shadow-lg hover:bg-white transition opacity-0 pointer-events-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <button id="scroll-right-entdecke" class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 backdrop-blur-sm p-2 rounded-full shadow-lg hover:bg-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <div id="entdecke-carousel" class="flex gap-4 overflow-x-auto hide-scrollbar pb-4 scroll-smooth">
                    <!-- Carousel cards will be dynamically generated in here -->
                </div>
            </div>

            <!-- Carousel Dots -->
            <div id="entdecke-dots" class="flex justify-center gap-2 mt-4">
                <div class="w-2 h-2 rounded-full" style="background-color: #6750A4;"></div>
                <div class="w-2 h-2 rounded-full" style="background-color: #6750A4;"></div>
                <div class="w-2 h-2 rounded-full" style="background-color: #6750A4;"></div>
            </div>
        </section>

        <!-- Deine Events Section -->
        <section class="mb-12">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-brand-purple">Deine Events</h2>
                <div class="flex gap-2">
                    <button class="scroll-btn-left bg-white/90 backdrop-blur-sm p-2 rounded-full shadow hover:bg-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <button class="scroll-btn-right bg-white/90 backdrop-blur-sm p-2 rounded-full shadow hover:bg-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Category Filter Tags -->
            <div class="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-2">
                <button class="filter-tag btn-tag" data-category="FLINTA*-only">FLINTA*-only</button>
                <button class="filter-tag btn-tag" data-category="Gaming">Gaming</button>
                <button class="filter-tag btn-tag" data-category="FLINTA*">FLINTA*</button>
                <button class="filter-tag btn-tag" data-category="angemeldet">angemeldet</button>
            </div>

            <!-- Event Cards Carousel -->
            <div class="relative">
                <div id="deine-events-carousel" class="flex gap-4 overflow-x-auto hide-scrollbar pb-4 scroll-smooth">
                    <!-- Cards will be generated here -->
                </div>
            </div>
        </section>

    </main>

    <div id="footer-placeholder" class="mt-16"></div>

    <script>
        // Load header and footer components
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    const element = document.getElementById(id);
                    element.innerHTML = data;
                    element.classList.add('loaded');
                    
                    element.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                });
        }

        // Cookie utilities
        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(cookie.substring(nameEQ.length));
                }
            }
            return null;
        }

        function setCookie(name, value, days = 365) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/`;
        }

        // Create event card with bookmark functionality
        function createEventCard(event, index, section = 'entdecke') {
            const displayLocation = event.location || event.organiser || '';
            const hasLocation = event.location;
            const eventId = `carousel-${index}`;
            
            return `
                <a href="event.html?id=${eventId}" class="flex-shrink-0 w-64 bg-white rounded-2xl shadow-sm overflow-hidden hover:shadow-lg transition-shadow duration-300 block relative">
                    <button onclick="event.stopPropagation(); toggleBookmark('${eventId}')" class="bookmark-btn absolute top-2 right-2 z-10 bg-white/90 backdrop-blur-sm p-2 rounded-lg hover:bg-white transition" data-event-id="${eventId}">
                        <svg class="w-4 h-4 bookmark-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                    </button>
                    <div class="h-32 bg-gray-200 overflow-hidden">
                        <img src="${event.image}" alt="" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 space-y-2">
                        <span class="btn-tag">${event.category}</span>
                        <h3 class="font-bold text-sm">${event.title}</h3>
                        ${displayLocation ? `<p class="text-xs text-gray-500 ${hasLocation ? 'underline' : ''}">${displayLocation}</p>` : ''}
                        <p class="text-xs text-gray-400">${event.date} · ${event.time}</p>
                    </div>
                </div>
            `;
        }

        // Toggle bookmark state and show modal only on add
        function toggleBookmark(eventId, eventTitle, eventImage) {
            const bookmarks = getBookmarkedEvents();
            const index = bookmarks.indexOf(eventId);
            const isAdding = index === -1;
            
            if (isAdding) {
                bookmarks.push(eventId);
            } else {
                bookmarks.splice(index, 1);
            }
            
            setCookie('bookmarked_events', JSON.stringify(bookmarks));
            updateBookmarkUI();
            renderDeineEvents();
            
            // Show modal only when adding bookmark
            if (isAdding && typeof BookmarkModal !== 'undefined' && eventTitle && eventImage) {
                BookmarkModal.show(eventTitle, eventImage);
            }
        }

        // Get bookmarked events
        function getBookmarkedEvents() {
            const bookmarks = getCookie('bookmarked_events');
            return bookmarks ? JSON.parse(bookmarks) : [];
        }

        // Update bookmark button UI
        function updateBookmarkUI() {
            const bookmarks = getBookmarkedEvents();
            document.querySelectorAll('.bookmark-btn').forEach(btn => {
                const eventId = btn.getAttribute('data-event-id');
                const icon = btn.querySelector('.bookmark-icon');
                
                if (bookmarks.includes(eventId)) {
                    icon.setAttribute('fill', 'currentColor');
                } else {
                    icon.setAttribute('fill', 'none');
                }
            });
        }

        // Render Entdecke carousel
        function renderEntdecke() {
            const carousel = document.getElementById('entdecke-carousel');
            carousel.innerHTML = eventsData.carousel.map((event, index) => 
                createCarouselCard(event, index)
            ).join('');
            
            // Create dots
            const dotsContainer = document.getElementById('entdecke-dots');
            dotsContainer.innerHTML = eventsData.carousel.map((_, index) => 
                `<button class="carousel-dot w-2 h-2 rounded-full ${index === 0 ? 'bg-gray-400' : 'bg-gray-300'} transition-all duration-300 hover:scale-125" data-index="${index}"></button>`
            ).join('');
            
            // Update bookmark UI after rendering
            updateBookmarkUI();
            
            // Setup dot navigation
            setupDotNavigation('entdecke-carousel', 'entdecke-dots');
        }

        // Render Deine Events carousel
        function renderDeineEvents() {
            const carousel = document.getElementById('deine-events-carousel');
            const bookmarks = getBookmarkedEvents();
            
            if (bookmarks.length === 0) {
                carousel.innerHTML = `
                    <div class="w-full text-center py-12">
                        <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                        <p class="text-[#6750A4] font-semibold">Noch keine Events gemerkt</p>
                        <p class="text-gray-400 text-sm mt-2">Klicke auf das Lesezeichen-Icon bei einem Event, um es hier zu speichern</p>
                    </div>
                `;
                return;
            }
            
            // Get bookmarked events
            const myEvents = bookmarks.map(eventId => {
                const index = parseInt(eventId.replace('carousel-', ''));
                return { ...eventsData.carousel[index], originalIndex: index };
            }).filter(event => event.title); // Filter out undefined events
            
            carousel.innerHTML = myEvents.map(event => 
                createEventCard(event, event.originalIndex, 'deine')
            ).join('');
            
            // Update bookmark UI
            updateBookmarkUI();
        }

        // Setup dot navigation for carousel
        function setupDotNavigation(carouselId, dotsId) {
            const carousel = document.getElementById(carouselId);
            const dots = document.querySelectorAll(`#${dotsId} .carousel-dot`);
            
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    const cardWidth = carousel.querySelector('.flex-shrink-0').offsetWidth + 16; // width + gap
                    carousel.scrollTo({ left: cardWidth * index, behavior: 'smooth' });
                    
                    // Update active dot
                    dots.forEach(d => d.classList.remove('bg-gray-400'));
                    dots.forEach(d => d.classList.add('bg-gray-300'));
                    dot.classList.remove('bg-gray-300');
                    dot.classList.add('bg-gray-400');
                });
            });
            
            // Update dots on scroll
            carousel.addEventListener('scroll', () => {
                const cardWidth = carousel.querySelector('.flex-shrink-0').offsetWidth + 16;
                const scrollIndex = Math.round(carousel.scrollLeft / cardWidth);
                
                dots.forEach((d, i) => {
                    if (i === scrollIndex) {
                        d.classList.remove('bg-gray-300');
                        d.classList.add('bg-gray-400');
                    } else {
                        d.classList.remove('bg-gray-400');
                        d.classList.add('bg-gray-300');
                    }
                });
            });
        }

        // Initialize scroll buttons
        function initializeScrollButtons(carouselId, leftBtnId, rightBtnId) {
            const carousel = document.getElementById(carouselId);
            const scrollLeftBtn = document.getElementById(leftBtnId);
            const scrollRightBtn = document.getElementById(rightBtnId);

            if (scrollLeftBtn && scrollRightBtn && carousel) {
                scrollLeftBtn.addEventListener('click', () => {
                    carousel.scrollBy({ left: -300, behavior: 'smooth' });
                });

                scrollRightBtn.addEventListener('click', () => {
                    carousel.scrollBy({ left: 300, behavior: 'smooth' });
                });
                
                // Show/hide scroll buttons based on scroll position
                function updateScrollButtons() {
                    const isAtStart = carousel.scrollLeft <= 0;
                    const isAtEnd = carousel.scrollLeft >= carousel.scrollWidth - carousel.clientWidth - 10;
                    
                    if (isAtStart) {
                        scrollLeftBtn.classList.add('opacity-0', 'pointer-events-none');
                    } else {
                        scrollLeftBtn.classList.remove('opacity-0', 'pointer-events-none');
                    }
                    
                    if (isAtEnd) {
                        scrollRightBtn.classList.add('opacity-0', 'pointer-events-none');
                    } else {
                        scrollRightBtn.classList.remove('opacity-0', 'pointer-events-none');
                    }
                }
                
                carousel.addEventListener('scroll', updateScrollButtons);
                updateScrollButtons();
            }
        }

        // Initialize Deine Events scroll buttons (using class selectors)
        function initializeDeineEventsScrollButtons() {
            const carousel = document.getElementById('deine-events-carousel');
            const scrollLeftBtn = document.querySelector('.scroll-btn-left');
            const scrollRightBtn = document.querySelector('.scroll-btn-right');

            if (scrollLeftBtn && scrollRightBtn && carousel) {
                scrollLeftBtn.addEventListener('click', () => {
                    carousel.scrollBy({ left: -300, behavior: 'smooth' });
                });

                scrollRightBtn.addEventListener('click', () => {
                    carousel.scrollBy({ left: 300, behavior: 'smooth' });
                });
            }
        }

        // Initialize filter tags
        function initializeFilterTags() {
            const filterTags = document.querySelectorAll('.filter-tag');
            let activeCategory = null;
            
            filterTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const category = tag.getAttribute('data-category');
                    
                    if (activeCategory === category) {
                        // Deactivate filter
                        activeCategory = null;
                        resetFilterTags();
                        showAllEvents();
                    } else {
                        // Activate new filter
                        activeCategory = category;
                        resetFilterTags();
                        activateTag(tag);
                        filterEventsByCategory(category);
                    }
                });
            });
            
            function activateTag(tag) {
                const colors = tag.className.match(/bg-(\w+)-(\d+)/);
                if (colors) {
                    const color = colors[1];
                    tag.className = tag.className.replace(/bg-\w+-\d+/, `bg-${color}-400`);
                }
            }
            
            function resetFilterTags() {
                filterTags.forEach(t => {
                    const colors = t.className.match(/bg-(\w+)-(\d+)/);
                    if (colors) {
                        const color = colors[1];
                        const originalShade = t.getAttribute('data-category') === 'FLINTA*-only' ? '300' : '200';
                        t.className = t.className.replace(/bg-\w+-\d+/, `bg-${color}-${originalShade}`);
                    }
                });
            }
            
            function showAllEvents() {
                const cards = document.querySelectorAll('#deine-events-carousel > div');
                cards.forEach(card => card.style.display = 'block');
            }
            
            function filterEventsByCategory(category) {
                const cards = document.querySelectorAll('#deine-events-carousel > div');
                cards.forEach(card => {
                    const cardCategory = card.querySelector('.btn-tag')?.textContent.trim();
                    if (category === 'angemeldet' || cardCategory === category || category === 'FLINTA*') {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }
        }

        // Load username from cookie or use default
        function loadUsername() {
            const username = getCookie('username') || 'SaturoGojo67';
            document.getElementById('username').textContent = username;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
            
            loadUsername();
            renderEntdecke();
            renderDeineEvents();
            
            initializeScrollButtons('entdecke-carousel', 'scroll-left-entdecke', 'scroll-right-entdecke');
            initializeDeineEventsScrollButtons();
            initializeFilterTags();
        });
    </script>

</body>
</html>
